<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão de pedidos - V15.06.7</title>
    <style>
        :root { 
            --blue-dark: #001a33; 
            --blue-main: #003366; 
            --accent: #21a366; 
            --danger: #d9534f;
            --bg: #e9ecef; 
            --card: #ffffff; 
            --text: #333;
            --zebra: #f1f5f9;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 10px; display: flex; justify-content: center; color: var(--text); overflow-x: hidden; }
        .app { background: var(--card); width: 100%; max-width: 500px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); overflow: hidden; display: flex; flex-direction: column; height: 96vh; position: relative; border: 1px solid #ddd; }

        header { background: var(--blue-dark); color: white; padding: 20px; text-align: center; flex-shrink: 0; border-bottom: 4px solid var(--accent); position: relative; }
        .btn-top { background: var(--danger); color: white; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; position: absolute; right: 10px; top: 20px; }

        .tabs { display: flex; background: #f8f9fa; border-bottom: 1px solid #dee2e6; flex-shrink: 0; }
        .tab { flex: 1; padding: 15px 5px; text-align: center; cursor: pointer; font-weight: 700; font-size: 12px; color: #6c757d; text-transform: uppercase; }
        .tab.active { color: var(--blue-main); border-bottom: 3px solid var(--blue-main); background: #fff; }

        .content { padding: 12px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .page { display: none; flex-direction: column; gap: 12px; width: 100%; }
        .page.active { display: flex; }

        .form-section { background: #fcfcfc; border: 1px solid #eee; border-radius: 12px; padding: 12px; width: 100%; }
        .section-title { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; border-bottom: 1px solid #eee; padding-bottom: 5px; display: block; }

        label { font-weight: 700; font-size: 13px; color: var(--blue-main); display: block; margin-bottom: 4px; }
        input, select { padding: 12px; border: 1px solid #ced4da; border-radius: 10px; width: 100%; font-size: 16px; background: white; color: var(--text); }
        select:disabled { background: #e9ecef; color: #6c757d; cursor: not-allowed; }

        .material-box { border: 2px dashed #cbd5e0; padding: 12px; border-radius: 12px; background: #f1f5f9; position: relative; width: 100%; }
        .btn-add { background: var(--blue-main); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 15px; }
        .btn-add:disabled { background: #ccc; cursor: not-allowed; }

        .cascata-group { background: #fff; padding: 10px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
        .cascata-group label { font-size: 11px; color: #666; margin-bottom: 0; }
        .cascata-group select { padding: 8px; font-size: 14px; }

        .switch-container { display: flex; align-items: center; gap: 10px; margin: 10px 0; background: #fff; padding: 8px; border-radius: 8px; border: 1px solid #ddd; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); }

        .list-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding: 14px 12px; border-radius: 8px; border: 1px solid #eee; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.06); gap: 10px; }
        .list-item:nth-child(even), .hist-table tr:nth-child(even), .base-table tr:nth-child(even) { background-color: var(--zebra); }
        
        .list-text-wrapper { display: flex; align-items: center; flex: 1; min-width: 0; font-size: 13px; color: #333; gap: 8px; }
        .item-code { font-weight: bold; width: 70px; flex-shrink: 0; color: #000; font-size: 14px; }
        .item-desc { flex: 1; min-width: 0; padding-right: 5px; white-space: normal; word-break: break-word; line-height: 1.3; color: #444; }
        .item-qty-wrapper { display: flex; flex-direction: row; gap: 12px; flex-shrink: 0; align-items: center; justify-content: flex-end; font-size: 13px; }
        .item-qty { font-weight: normal; color: #000; white-space: nowrap; }

        .history-card { background: #fff; padding: 12px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: relative; display: block; }
        .btn-del-card { position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 16px; cursor: pointer; color: var(--danger); display: inline-block; z-index: 10; }

        .hist-table, .base-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
        .hist-table th, .hist-table td, .base-table th, .base-table td { padding: 10px 8px; border-bottom: 1px solid #eee; text-align: left; }

        .hist-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 12px; border-top: 1px solid #eee; padding-top: 10px; width: 100%; }
        .hist-actions button:last-child { grid-column: span 2; } 

        .btn-hist { padding: 10px 4px; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; color: white; text-align: center; display: inline-block; }
        .btn-h-edit { background: #f0ad4e !important; }
        .btn-h-planilha { background: var(--blue-main) !important; }
        .btn-h-wa { background: #25D366 !important; } 
        .btn-h-aprovar { background: #5bc0de !important; }
        .btn-h-csv { background: #333333 !important; }

        footer { padding: 10px 15px; background: #fff; border-top: 1px solid #eee; text-align: center; flex-shrink: 0; }
        .btn-confirm { background: #ccc; color: #fff; border: none; padding: 16px; width: 100%; font-weight: 800; border-radius: 12px; cursor: not-allowed; font-size: 16px; }
        .btn-confirm.active { background: var(--accent); cursor: pointer; }

        .search-results { position: absolute; background: white; width: 100%; left: 0; z-index: 999; border: 1px solid #ccc; display: none; max-height: 200px; overflow-y: auto; border-radius: 10px; }
        .condicional-fields { display: none; flex-direction: column; gap: 8px; margin-top: 12px; border-left: 3px solid var(--blue-main); padding-left: 10px; }

        @media print {
            body { background: white; padding: 0; color: #000; }
            .app { box-shadow: none; border: none; width: 100%; max-width: none; height: auto; display: block; }
            header, .tabs, footer, .btn-top, .material-box, .btn-del-card, .hist-actions { display: none !important; }
            .history-card { border: 1px solid #333; page-break-inside: avoid; margin-bottom: 20px; padding: 20px; border-radius: 0; }
        }
    </style>
</head>
<body>

<div class="app">
    <header>
        <strong>FAST REQUEST PRO</strong><br><small>Gestão de pedidos | V15.06.7</small>
        <button class="btn-top" onclick="confirmReset()">LIMPAR</button>
    </header>

    <div class="tabs">
        <div id="tab-request" class="tab active" onclick="switchTab('request')">📋 NOVO</div>
        <div id="tab-history" class="tab" onclick="switchTab('history')">📂 HISTÓRICO</div>
        <div id="tab-config" class="tab" onclick="switchTab('config')">⚙️ BASE</div>
    </div>

    <div class="content">
        <div id="page-request" class="page active" oninput="saveDraft()">
            <div class="form-section">
                <span class="section-title">👤 Identificação</span>
                <div style="margin-bottom:12px">
                    <label>Solicitante:</label>
                    <div style="display:flex; gap:5px">
                        <div style="flex:3; position:relative">
                            <input type="text" id="sol_nome" placeholder="Buscar..." onkeyup="searchData('sol')" autocomplete="off">
                            <div id="sol_results" class="search-results"></div>
                        </div>
                        <input type="text" id="sol_mat" readonly placeholder="Mat." style="flex:1.2; background:#f1f3f5; text-align:center;">
                    </div>
                </div>
                <div>
                    <label>Atendente:</label>
                    <div style="display:flex; gap:5px">
                        <div style="flex:3; position:relative">
                            <input type="text" id="ate_nome" placeholder="Buscar..." onkeyup="searchData('ate')" autocomplete="off">
                            <div id="ate_results" class="search-results"></div>
                        </div>
                        <input type="text" id="ate_mat" readonly placeholder="Mat." style="flex:1.2; background:#f1f3f5; text-align:center;">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <span class="section-title">🚧 Dados do Pedido</span>
                
                <div style="margin-bottom:12px">
                    <label>Centro (Coluna D):</label>
                    <div style="position:relative">
                        <input type="text" id="centro_busca" placeholder="Filtrar Centro..." onkeyup="searchData('centro')" autocomplete="off">
                        <div id="centro_results" class="search-results"></div>
                    </div>
                    <input type="hidden" id="centro_selecionado">
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:12px">
                    <div><label>Projeto ou OSM:</label><input type="text" id="projeto" oninput="this.value = this.value.toUpperCase()"></div>
                    <div>
                        <label>Tipo de Solicitação:</label>
                        <select id="tipo_sol_fake">
                            <option value="">OSM</option>
                            <option>Programada</option>
                        </select>
                    </div>
                    <div style="grid-column: span 2">
                        <label>Processo:</label>
                        <select id="processo">
                            <option value="">Selecione</option>
                            <option>Manutencao Corretiva BT</option>
                            <option>Manutencao Corretiva BT - LV</option>
                            <option>Manutencao Corretiva BT - Subterranea</option>
                            <option>Manutencao Corretiva MT</option>
                            <option>Manutencao Corretiva MT - LV</option>
                            <option>Manutencao Corretiva MT - Subterranea</option>
                            <option>Manutencao Corretiva Submarino</option>
                            <option>Manutencao de Cabine</option>
                            <option>Manutencao Lavagem</option>
                            <option>Manutencao Preventiva BT</option>
                            <option>Manutencao Preventiva BT - LV</option>
                            <option>Manutencao Preventiva BT - Subterranea</option>
                            <option>Manutencao Preventiva Medicao Grafica</option>
                            <option>Manutencao Preventiva MT</option>
                            <option>Manutencao Preventiva MT - LV</option>
                            <option>Manutencao Preventiva MT - Subterranea</option>
                            <option>Manutencao Preventiva Submarino</option>
                            <option>Poda BT - Aereo</option>
                            <option>Poda MT - Aereo</option>
                            <option>Projeto Monitor Ramal</option>
                            <option>Projeto MQS - ODD</option>
                            <option>Projeto MQS - ODI</option>
                            <option>Projeto PMC - ODD</option>
                            <option>Projeto PMC - ODI</option>
                            <option>Projeto PQBT - ODD</option>
                            <option>Projeto PQBT - ODI</option>
                            <option>Recondutoramento MT - ODD</option>
                            <option>Recondutoramento MT - ODI</option>
                            <option>Reposicao de Ativos Corretivo - ODD</option>
                            <option>Reposicao de Ativos Corretivo - ODI</option>
                            <option>Reposicao de Ativos Furto</option>
                            <option>REPOSICAO DE MATERIAIS EMERGENCIAIS</option>
                            <option>Reposicao de Ativos Preventivo - ODD</option>
                            <option>Reposicao de Ativos Preventivo - ODI</option>
                            <option>Telecontrole - ODD</option>
                            <option>Telecontrole - ODI</option>
                            <option>Recuperacao de Cabines - ODD</option>
                            <option>Recuperacao de Cabines - ODI</option>
                            <option>Reposicao de Ativos Telecontrole ODD</option>
                            <option>Reposicao de Ativos Telecontrole ODI</option>
                            <option>Reposicao - Banco Capacitor MT/Regulador MT - ODI</option>
                            <option>Reposicao - Banco Capacitor MT/Regulador MT - ODD</option>
                        </select>
                    </div>
                    <div><label>Saída Geral ADM?</label><select id="mat_adm" onchange="executarLogicaGeralAdm()"><option value="Não">Não</option><option value="Sim">Sim</option></select></div>
                </div>
                <div style="margin-bottom:12px"><label>Tipo de Movimentação:</label>
                    <select id="movimentacao">
                        <option value="Z61 - Saída de material">Z61 - Saída de material</option>
                        <option value="Estorno de material">Estorno de material</option>
                        <option value="Z6D - Devolução de sucata">Z6D - Devolução de sucata</option>
                    </select>
                </div>
                <div style="margin-bottom:12px"><label>Deseja informar a reserva?</label>
                    <select id="reserva" onchange="toggleCondicionalFields(); saveDraft()"><option value="Não">Não</option><option value="Sim">Sim</option></select>
                </div>
                <div id="campos_condicionais" class="condicional-fields">
                    <div><label>ID do fluxo:</label><input type="text" id="id_fluxo"></div>
                    <div><label>Reserva:?</label><input type="text" id="reserva_num"></div>
                </div>
            </div>

            <div class="material-box">
                <span class="section-title">📦 Seleção de Itens</span>

                <div style="margin-bottom: 12px;">
                    <label>Modo de inserção:</label>
                    <select id="is_kit_option" onchange="toggleKitSearch()">
                        <option value="Não">Material Individual</option>
                        <option value="Sim">Kit por Cascata Técnica</option>
                    </select>
                </div>

                <div id="kit_cascata_div" style="display:none; margin-bottom: 15px;">
                    <div class="cascata-group">
                        <label>1. Estrutura (C):</label><select id="c_est" onchange="filtrarCascata(1)"></select>
                        <label>2. Rede (D):</label><select id="c_red" onchange="filtrarCascata(2)" disabled></select>
                        <label>3. Tipo Poste (E):</label><select id="c_pos" onchange="filtrarCascata(3)" disabled></select>
                        <label>4. Nível (F):</label><select id="c_niv" onchange="filtrarCascata(4)" disabled></select>
                        <label>5. Altura Poste (G):</label><select id="c_alt" onchange="filtrarCascata(5)" disabled></select>
                        <label>6. Dan (H):</label><select id="c_dan" onchange="filtrarCascata(6)" disabled></select>
                        <label>7. Tipo Cabo (I):</label><select id="c_cab" onchange="filtrarCascata(7)" disabled></select>
                    </div>
                    <button id="btn_add_kit" class="btn-add" style="background:var(--accent); display:none" onclick="adicionarKitCascata()">INSERIR MATERIAIS DO KIT</button>
                </div>

                <div id="manual_search_div">
                    <label>Busque o material abaixo:</label>
                    <div style="position:relative"><input type="text" id="mat_busca" placeholder="Código ou descrição..." onkeyup="searchData('mat')" autocomplete="off"><div id="mat_results" class="search-results"></div></div>
                    <div id="mat_desc" style="font-size:14px; color:#000; margin:8px 0; font-weight:bold; line-height:1.2;">Nenhum item selecionado</div>

                    <div style="margin-bottom: 12px;">
                        <label>Este material é ADM?</label>
                        <select id="item_is_adm"><option value="Não">Não</option><option value="Sim">Sim</option></select>
                    </div>

                    <div class="switch-container">
                        <span style="font-size: 13px; font-weight: bold; color: var(--blue-main);">É transformador?</span>
                        <label class="switch"><input type="checkbox" id="is_trafo" onchange="toggleTrafoField()"><span class="slider"></span></label>
                        <div id="trafo_input_div" style="display:none; flex:1"><input type="number" id="trafo_serie" placeholder="Nº do Patrimônio"></div>
                    </div>

                    <div style="display:flex; gap:8px; align-items:flex-end">
                        <div style="flex:1"><label>QTD:</label><input type="text" id="mat_qtd" value="1" oninput="formatQtd(this)"></div>
                        <button id="btn_add_mat" class="btn-add" style="flex:1.5" onclick="addItem()" disabled>ADICIONAR</button>
                    </div>
                </div>
            </div>
            <div id="lista_ui" style="margin-top: 10px; display: flex; flex-direction: column; gap: 4px;"></div>
        </div>

        <div id="page-history" class="page">
            <div style="display:flex; gap:8px; margin-bottom:10px;">
                <button onclick="window.print()" style="flex:2; padding:12px; background:var(--blue-main); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">🖨️ IMPRIMIR LOTE</button>
                <button onclick="carregarHistoricoDaPlanilha()" style="flex:1; padding:12px; background:var(--accent); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">🔄 ATUALIZAR</button>
            </div>
            <div id="loading_hist" style="display:none; text-align:center; padding:10px; color:var(--blue-main); font-weight:bold;">Sincronizando...</div>
            <div id="history_list"></div>
        </div>

        <div id="page-config" class="page">
            <div class="form-section">
                <span class="section-title">📊 Base de Dados</span>
                <button onclick="updateBaseFromGithub()" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; background:var(--blue-dark); color:white; border:none; font-weight:bold; cursor:pointer;">ATUALIZAR BASE</button>
                <div style="max-height: 400px; overflow-y: auto;">
                    <table class="base-table" id="table-users">
                        <thead style="position: sticky; top: 0; background: var(--blue-main); color: white;">
                            <tr><th>NOME COMPLETO</th><th>MATRÍCULA</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <button id="btn_confirm" class="btn-confirm" onclick="confirmarPedido()">CONFIRMAR</button>
    </footer>
</div>

<script>
    let db = { users: [], mats: [], mb52: [], kitBase: [] };
    let listaSolicitacao = [];
    let historico = [];

    const URL_PLANILHA_GAS = "https://script.google.com/macros/s/AKfycbzJ1NqScxnQi9SUN7QM5soktSmRi5CV4AY862IgW1Nx0BqgVSmKWrkG7D7Kg9ceSZ2_ew/exec";    
    const GITHUB_USERS = "https://raw.githubusercontent.com/leiclermarvim-hash/URL_USUARIOS_GITHUB/refs/heads/main/URL_USUARIOS_GITHUB.csv";
    const GITHUB_MATS = "https://raw.githubusercontent.com/leiclermarvim-hash/URL_USUARIOS_GITHUB/refs/heads/main/URL_MATERIAIS_GITHUB.csv";
    const GITHUB_MB52 = "https://raw.githubusercontent.com/leiclermarvim-hash/teste-app-2.0/main/MB52%20(9).csv";
    const GITHUB_KITS = "https://raw.githubusercontent.com/leiclermarvim-hash/teste-app-2.0/main/kit_fast_request.csv";

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-results') && !e.target.closest('input')) {
            document.querySelectorAll('.search-results').forEach(d => d.style.display = 'none');
        }
    });

    window.onload = () => {
        const h = localStorage.getItem('fast_request_history');
        if(h) historico = JSON.parse(h);
        const cachedDb = localStorage.getItem('fast_request_db');
        if(cachedDb) { db = JSON.parse(cachedDb); renderUsersTable(); }
        updateBaseFromGithub(true); 
        carregarHistoricoDaPlanilha();
        executarLogicaGeralAdm();
    };

    function ejecutarLogicaGeralAdm() {
        const IsGeralAdm = document.getElementById('mat_adm').value === "Sim";
        const selectItemAdm = document.getElementById('item_is_adm');
        if (IsGeralAdm) { selectItemAdm.value = "Sim"; selectItemAdm.disabled = true; } 
        else { selectItemAdm.disabled = false; }
        saveDraft();
    }

    function toggleKitSearch() {
        const isKit = document.getElementById('is_kit_option').value === "Sim";
        document.getElementById('kit_cascata_div').style.display = isKit ? 'block' : 'none';
        document.getElementById('manual_search_div').style.display = isKit ? 'none' : 'block';
        if(isKit && db.kitBase.length > 0) {
            popularSelect('c_est', [...new Set(db.kitBase.map(x => x.est))]);
            document.getElementById('c_est').disabled = false;
        }
    }

    function popularSelect(id, opcoes) {
        const sel = document.getElementById(id);
        sel.innerHTML = '<option value="">Selecione...</option>' + 
            opcoes.filter(o => o).sort().map(o => `<option value="${o}">${o}</option>`).join('');
    }

    function filtrarCascata(nivel) {
        const ids = ['c_est', 'c_red', 'c_pos', 'c_niv', 'c_alt', 'c_dan', 'c_cab'];
        const props = ['est', 'red', 'pos', 'niv', 'alt', 'dan', 'cab'];
        
        for (let i = nivel; i < ids.length; i++) {
            const campoSubsequente = document.getElementById(ids[i]);
            campoSubsequente.innerHTML = '<option value="">Aguardando...</option>';
            campoSubsequente.disabled = true;
        }
        document.getElementById('btn_add_kit').style.display = 'none';

        if (document.getElementById(ids[nivel - 1]).value === "") return;

        let dadosFiltrados = db.kitBase;
        for (let i = 0; i < nivel; i++) {
            const valorSelecionado = document.getElementById(ids[i]).value;
            if (valorSelecionado) {
                dadosFiltrados = dadosFiltrados.filter(x => x[props[i]] === valorSelecionado);
            }
        }

        if (nivel === ids.length) {
            document.getElementById('btn_add_kit').style.display = 'block';
            return;
        }

        const proximasOpcoes = [...new Set(dadosFiltrados.map(x => x[props[nivel]]))].filter(o => o && o.trim() !== "");

        if (proximasOpcoes.length > 0) {
            popularSelect(ids[nivel], proximasOpcoes);
            document.getElementById(ids[nivel]).disabled = false;
        } else {
            const kitFinal = dadosFiltrados[0];
            if (kitFinal && kitFinal.codigoKit) {
                document.getElementById('btn_add_kit').style.display = 'block';
            }
        }
    }

   function adicionarKitCascata() {
        const sel = {
            est: document.getElementById('c_est').value,
            red: document.getElementById('c_red').value,
            pos: document.getElementById('c_pos').value,
            niv: document.getElementById('c_niv').value,
            alt: document.getElementById('c_alt').value,
            dan: document.getElementById('c_dan').value,
            cab: document.getElementById('c_cab').value
        };

        let materiaisDoKit = db.kitBase.filter(x => 
            (!sel.est || x.est === sel.est) && (!sel.red || x.red === sel.red) && 
            (!sel.pos || x.pos === sel.pos) && (!sel.niv || x.niv === sel.niv) && 
            (!sel.alt || x.alt === sel.alt) && (!sel.dan || x.dan === sel.dan) && 
            (!sel.cab || x.cab === sel.cab)
        );

        if (materiaisDoKit.length === 0) {
            alert("Nenhum material associado a essa combinação técnica.");
            return;
        }

        const codigoDoKitSelecionado = materiaisDoKit[0].codigoKit;
        if (codigoDoKitSelecionado) {
            materiaisDoKit = db.kitBase.filter(x => x.codigoKit === codigoDoKitSelecionado);
        }

        const itemAdm = document.getElementById('mat_adm').value;

        materiaisDoKit.forEach(it => {
            const cod = it.matCod ? it.matCod.replace(/\r|\n/g, '').trim() : "";
            if (!cod) return;

            const materialOficial = db.mats.find(m => m.cod === cod);
            let descReal = materialOficial ? materialOficial.desc : (it.matDescOriginal || "MATERIAL TÉCNICO");
            descReal = descReal.replace(/\r|\n/g, '').trim();
            
            const qtdLimpa = it.matQtd ? it.matQtd.replace(/\r|\n/g, '').trim() : "1";
            const qtdNum = parseFloat(qtdLimpa.replace(',', '.')) || 1;

            let itemExistente = listaSolicitacao.find(x => x.cod === cod);
            if (itemExistente) {
                let qtdAtual = parseFloat(itemExistente.qtd.toString().replace(',', '.')) || 0;
                let novaQtd = qtdAtual + qtdNum;
                itemExistente.qtd = novaQtd.toString().replace('.', ',');
            } else {
                // CORRIGIDO: cod recebe o código numérico e desc recebe a descrição textual
                listaSolicitacao.push({
                    cod: descReal,
                    desc: cod, 
                    qtd: qtdLimpa.replace('.', ','), 
                    adm: itemAdm
                });
            }
        });

        renderList();
        validarForm();
        alert("Materiais do kit inseridos com sucesso!");
    }

    function formatQtd(el) {
        let val = el.value.replace(/[^\d.,]/g, '').replace(/\./g, ',');
        const partes = val.split(',');
        if (partes.length > 2) val = partes[0] + ',' + partes.slice(1).join('');
        el.value = val;
    }

    function toggleTrafoField() {
        document.getElementById('trafo_input_div').style.display = document.getElementById('is_trafo').checked ? 'block' : 'none';
    }

    function switchTab(t) {
        document.querySelectorAll('.tab, .page').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-'+t).classList.add('active');
        document.getElementById('page-'+t).classList.add('active');
        document.querySelector('footer').style.display = (t === 'request') ? 'block' : 'none';
        if (t === 'history') { renderHistory(); }
    }

    function toggleCondicionalFields() {
        document.getElementById('campos_condicionais').style.display = (document.getElementById('reserva').value === "Sim") ? 'flex' : 'none';
    }

    function saveDraft() {
        const d = {
            sol_nome: document.getElementById('sol_nome').value, sol_mat: document.getElementById('sol_mat').value,
            ate_nome: document.getElementById('ate_nome').value, ate_mat: document.getElementById('ate_mat').value,
            projeto: document.getElementById('projeto').value, reserva: document.getElementById('reserva').value,
            processo: document.getElementById('processo').value, centro_selecionado: document.getElementById('centro_selecionado').value,
            centro_busca: document.getElementById('centro_busca').value, itens: listaSolicitacao,
            movimentacao: document.getElementById('movimentacao').value
        };
        localStorage.setItem('fast_request_draft', JSON.stringify(d));
        validarForm();
    }

    function searchData(mode) {
        const input = document.getElementById(mode === 'mat' ? 'mat_busca' : (mode === 'centro' ? 'centro_busca' : mode + '_nome'));
        const resDiv = document.getElementById(mode + '_results');
        const t = input.value.toUpperCase();
        if (t.length < 1) { resDiv.style.display = 'none'; return; }

        let html = "";
        if (mode === 'centro') {
            const centros = [...new Set(db.mb52.map(x => x.centro))].filter(c => c && c.includes(t));
            html = centros.slice(0, 5).map(c => `<div style="padding:10px; cursor:pointer;" onclick="selectCentro('${c}')">Centro <b>${c}</b></div>`).join('');
        } else if (mode === 'mat') {
            const centroAtivo = document.getElementById('centro_selecionado').value;
            if(!centroAtivo) { alert("Selecione um Centro primeiro!"); return; }
            
            let f = db.mats.filter(m => m.cod.includes(t) || m.desc.includes(t));
            html = f.slice(0, 8).map(m => {
                const estoqueObj = db.mb52.find(x => x.cod === m.cod && x.centro === centroAtivo);
                const qtdEstoque = estoqueObj ? parseFloat(estoqueObj.qtd.replace(',','.')) : 0;
                const cor = qtdEstoque > 0 ? 'green' : 'red';
                return `<div style="padding:10px; border-bottom:1px solid #eee; cursor:pointer;" onclick="selectItem('mat','${m.cod}','${m.desc}','${qtdEstoque}')">
                    <b>${m.cod}</b><br><small>${m.desc}</small><br>
                    <small style="color:${cor}; font-weight:bold;">Saldo no Centro: ${qtdEstoque}</small></div>`;
            }).join('');
        } else {
            let f = db.users.filter(u => u.nome.includes(t));
            html = f.slice(0, 8).map(x => `<div style="padding:10px; border-bottom:1px solid #eee; cursor:pointer;" onclick="selectItem('${mode}','${x.nome}','${x.mat}')"><b>${x.nome}</b><br><small>${x.mat}</small></div>`).join('');
        }
        resDiv.innerHTML = html; resDiv.style.display = html ? 'block' : 'none';
    }

    function selectCentro(c) {
        document.getElementById('centro_busca').value = c;
        document.getElementById('centro_selecionado').value = c;
        document.getElementById('centro_results').style.display = 'none';
        renderList(); 
        saveDraft();
    }

    function selectItem(m, v1, v2, v3) {
        if (m === 'mat') { 
            document.getElementById('mat_busca').value = v1; 
            const cor = parseFloat(v3) > 0 ? 'green' : 'red';
            document.getElementById('mat_desc').innerHTML = `${v2} <br> <span style="color:${cor}">Saldo: ${v3}</span>`; 
            document.getElementById('btn_add_mat').disabled = false; 
        } else {
            document.getElementById(m + '_nome').value = v1; 
            document.getElementById(m + '_mat').value = v2;
        }
        document.querySelectorAll('.search-results').forEach(d => d.style.display = 'none');
        saveDraft();
    }

    function addItem() {
        const cod = document.getElementById('mat_busca').value;
        const descOriginal = document.getElementById('mat_desc').innerText.split('\n')[0];
        const qtdRaw = document.getElementById('mat_qtd').value;
        const itemAdm = document.getElementById('item_is_adm').value;
        const isTrafo = document.getElementById('is_trafo').checked;
        const numSerie = document.getElementById('trafo_serie').value;

        if (!cod || qtdRaw === "0") return;

        let descFinal = descOriginal;
        if(isTrafo && numSerie) descFinal += ` (Patrimônio: ${numSerie})`;

        let qtdInseridaNum = parseFloat(qtdRaw.replace(',', '.')) || 1;
        let itemExistente = listaSolicitacao.find(x => x.cod === cod);

        if (itemExistente) {
            let qtdAtualNum = parseFloat(itemExistente.qtd.toString().replace(',', '.')) || 0;
            let somaQtd = qtdAtualNum + qtdInseridaNum;
            itemExistente.qtd = somaQtd.toString().replace('.', ',');
            itemExistente.adm = itemAdm;
        } else {
            listaSolicitacao.push({ cod: cod, desc: descFinal, qtd: qtdRaw, adm: itemAdm });
        }
        
        document.getElementById('mat_busca').value = "";
        document.getElementById('mat_desc').innerText = "Nenhum item selecionado";
        document.getElementById('mat_qtd').value = "1";
        document.getElementById('btn_add_mat').disabled = true;
        renderList(); saveDraft();
    }

    function renderList() {
        const centroAtivo = document.getElementById('centro_selecionado').value;
        document.getElementById('lista_ui').innerHTML = listaSolicitacao.map((item, i) => {
            let saldoTexto = "---"; 
            let corSaldo = "#666";
            let descMB52 = item.desc; 

            if (centroAtivo) {
                const estoqueObj = db.mb52.find(x => x.cod === item.cod && x.centro === centroAtivo);
                if (estoqueObj) {
                    saldoTexto = estoqueObj.qtd;
                    corSaldo = parseFloat(estoqueObj.qtd.replace(',', '.')) > 0 ? '#21a366' : 'var(--danger)';
                    
                    // Altera a descrição estática do item pela descrição atualizada do MB52 se encontrada
                    if (estoqueObj.desc) {
                        descMB52 = estoqueObj.desc.toUpperCase();
                    }
                } else { 
                    saldoTexto = "0"; 
                    corSaldo = 'var(--danger)'; 
                }
            }
            
            return `
            <div class="list-item">
                <div class="list-text-wrapper" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                    <span class="item-code">${item.cod}</span>
                    
                    <span class="item-desc">
                        ${descMB52}${item.adm === 'Sim' ? ' <small style="color:var(--danger); font-weight:bold;">(ADM)</small>' : ''}
                    </span>
                    
                    <div class="item-qty-wrapper">
                        <span class="item-qty">Ped: <b>${item.qtd}</b></span>
                        <span class="item-qty" style="color:${corSaldo}; min-width: 55px; text-align: left; padding-left: 4px;">Disp: <b>${saldoTexto}</b></span>
                    </div>
                </div>
                <button style="background: none; border: none; cursor: pointer; color: var(--danger); font-size: 16px; padding: 0 4px; flex-shrink:0;" onclick="listaSolicitacao.splice(${i},1);renderList();saveDraft()">🗑️</button>
            </div>`;
        }).reverse().join('');
    }

    function validarForm() {
        const ok = listaSolicitacao.length > 0 && document.getElementById('projeto').value !== "" && document.getElementById('sol_mat').value !== "";
        const btn = document.getElementById('btn_confirm');
        btn.disabled = !ok; btn.classList.toggle('active', ok);
    }

    function confirmarPedido() {
        if(!confirm("Salvar pedido?")) return;
        const novo = { 
            data: new Date().toLocaleString('pt-BR'), 
            projeto: document.getElementById('projeto').value, solic: document.getElementById('sol_nome').value, sol_mat: document.getElementById('sol_mat').value, 
            atend: document.getElementById('ate_nome').value, atend_mat: document.getElementById('ate_mat').value,
            processo: document.getElementById('processo').value, movim: document.getElementById('movimentacao').value,
            reserva_num: document.getElementById('reserva_num').value, id_fluxo: document.getElementById('id_fluxo').value,
            mat_adm: document.getElementById('mat_adm').value, itens: [...listaSolicitacao], status: 'pendente' 
        };
        historico.unshift(novo);
        localStorage.setItem('fast_request_history', JSON.stringify(historico));
        listaSolicitacao = []; renderList(); switchTab('history');
    }

    async function carregarHistoricoDaPlanilha() {
        const loading = document.getElementById('loading_hist');
        if(loading) loading.style.display = 'block';
        try {
            const response = await fetch(URL_PLANILHA_GAS);
            const dadosPlanilha = await response.json();
            if (dadosPlanilha && Array.isArray(dadosPlanilha)) {
                const pendentes = historico.filter(h => h.status === 'pendente');
                historico = [...pendentes, ...dadosPlanilha];
                localStorage.setItem('fast_request_history', JSON.stringify(historico));
                renderHistory();
            }
        } catch (e) { console.error(e); } finally { if(loading) loading.style.display = 'none'; }
    }

    function renderHistory() {
        const container = document.getElementById('history_list');
        if (!container) return;
        
        if (historico.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 20px; color: #666;">Nenhum pedido no histórico.</div>`;
            return;
        }

        container.innerHTML = historico.map((h, i) => `
            <div class="history-card">
                <button class="btn-del-card" onclick="deleteCard(${i})">🗑️</button>
                <div style="font-size:12px; margin-bottom:8px; padding-right: 25px;"><b>Projeto: ${h.projeto}</b> | ${h.data}</div>
                <table class="hist-table">
                    <thead>
                        <tr style="background:#eee; text-align:left;">
                            <th style="padding:4px;">Cód</th>
                            <th style="padding:4px;">Descrição</th>
                            <th style="padding:4px;">Qtd</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${h.itens && Array.isArray(h.itens) ? h.itens.map(it => `
                            <tr>
                                <td style="padding:4px; font-weight:bold;">${it.cod}</td>
                                <td style="padding:4px;">${it.desc} ${it.adm === 'Sim' ? '<small style="color:var(--danger);font-weight:bold;">(ADM)</small>' : ''}</td>
                                <td style="padding:4px; font-weight:bold;">${it.qtd}</td>
                            </tr>
                        `).join('') : '<tr><td colspan="3">Sem itens cadastrados</td></tr>'}
                    </tbody>
                </table>
                <div class="hist-actions">
                    <button class="btn-hist btn-h-edit" onclick="editarPedido(${i})">Editar</button>
                    <button class="btn-hist btn-h-planilha" onclick="efetivarPedido(${i}, this)">${h.status === 'efetivado' ? '✅ Sincronizado' : 'Salvar Planilha'}</button>
                    <button class="btn-hist btn-h-wa" onclick="reutilizarWA(${i})">WhatsApp</button>
                    <button class="btn-hist btn-h-aprovar" onclick="aprovarPedido(${i})">Aprovar</button>
                    <button class="btn-hist btn-h-csv" onclick="exportarParaCSV(${i})">Gerar CSV</button>
                </div>
            </div>`).join('');
    }

    function editarPedido(i) {
        if(!confirm("Deseja carregar este pedido de volta para edição? Isso substituirá a lista atual.")) return;
        const pedido = historico[i];
        document.getElementById('projeto').value = pedido.projeto || "";
        document.getElementById('sol_nome').value = pedido.solic || "";
        document.getElementById('sol_mat').value = pedido.sol_mat || "";
        document.getElementById('ate_nome').value = pedido.atend || "";
        document.getElementById('ate_mat').value = pedido.atend_mat || "";
        document.getElementById('processo').value = pedido.processo || "";
        document.getElementById('movimentacao').value = pedido.movim || "Z61 - Saída de material";
        document.getElementById('reserva_num').value = pedido.reserva_num || "";
        document.getElementById('id_fluxo').value = pedido.id_fluxo || "";
        document.getElementById('mat_adm').value = pedido.mat_adm || "Não";
        
        listaSolicitacao = [...pedido.itens];
        renderList();
        executarLogicaGeralAdm();
        switchTab('request');
        alert("Pedido carregado com sucesso na aba NOVO!");
    }

    function aprovarPedido(i) {
        alert(`Pedido do projeto "${historico[i].projeto}" marcado como APROVADO localmente!`);
    }

    function exportarParaCSV(i) {
        const pedido = historico[i];
        if(!pedido.itens || pedido.itens.length === 0) return alert("Nenhum item para exportar.");

        let ativoValor = "0"; 
        const movimLower = (pedido.movim || "").toLowerCase();
        if (movimLower.includes("z61")) {
            ativoValor = "1";
        } else if (movimLower.includes("devolução de sucata") || movimLower.includes("devolucao") || movimLower.includes("z6d")) {
            ativoValor = "2";
        }

        const numPedido = pedido.reserva_num ? pedido.reserva_num.trim() : "";

        let csvRows = [];
        csvRows.push("Codigo do material;descricao do material;Ativo;quantidade reservada;processo;Nº Pedido");

        pedido.itens.forEach(it => {
            const cod = it.cod ? it.cod.replace(/\r|\n/g, '').trim() : "";
            const desc = it.desc ? it.desc.replace(/;/g, ' ').replace(/\r|\n/g, '').trim() : "";
            const qtd = it.qtd ? it.qtd.replace(/\r|\n/g, '').trim() : "1";
            const proc = pedido.processo ? pedido.processo.replace(/;/g, ' ').replace(/\r|\n/g, '').trim() : "";
            
            csvRows.push(`${cod};${desc};${ativoValor};${qtd};${proc};${numPedido}`);
        });

        const csvString = csvRows.join("\n");
        const blob = new Blob(["\uFEFF" + csvString], { type: "text/csv;charset=utf-8;" });
        
        const link = document.createElement("a");
        if (navigator.msSaveBlob) { 
            navigator.msSaveBlob(blob, `pedido_${pedido.projeto || 'sem_nome'}.csv`);
        } else {
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `pedido_${pedido.projeto || 'sem_nome'}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    }

    async function efetivarPedido(idx, btn) {
        const h = historico[idx]; if(h.status === 'efetivado') return;
        btn.innerText = "⏳...";
        try {
            await fetch(URL_PLANILHA_GAS, { method: 'POST', mode: 'no-cors', body: JSON.stringify(h.itens.map(it => ({ ...h, item_cod: it.cod, item_desc: it.desc, item_qtd: it.qtd }))) });
            historico[idx].status = 'efetivado'; 
            localStorage.setItem('fast_request_history', JSON.stringify(historico));
            renderHistory();
        } catch(e) { btn.innerText = "Erro"; }
    }

    function reutilizarWA(i) {
        const h = historico[i]; 
        const texto = `*PROJETO: ${h.projeto}*%0A` + h.itens.map(m => `• ${m.cod} - Qtd: ${m.qtd}${m.adm === 'Sim' ? ' (ADM)' : ''}`).join('%0A');
        window.open(`https://wa.me/?text=${texto}`, '_blank');
    }

   async function updateBaseFromGithub(silent = false) {
        try {
            const [resU, resM, resMB, resK] = await Promise.all([fetch(GITHUB_USERS), fetch(GITHUB_MATS), fetch(GITHUB_MB52), fetch(GITHUB_KITS)]);
            const textU = await resU.text(), textM = await resM.text(), textMB = await resMB.text(), textK = await resK.text();
            
            // 1. Mapeamento de Usuários
            db.users = textU.split('\n').slice(1).map(r => { const c = r.split(';'); return c.length >= 2 ? { nome: c[0].trim().toUpperCase(), mat: c[1].trim() } : null; }).filter(x => x);
            
            // 2. Mapeamento de Materiais Geral
            db.mats = textM.split('\n').slice(1).map(r => { const c = r.split(';'); return c.length >= 2 ? { cod: c[0].trim(), desc: c[1].trim().toUpperCase() } : null; }).filter(x => x);
            
            // 3. Mapeamento do MB52 (Estoque Disponível)
            db.mb52 = textMB.split('\n').slice(1).map(r => { 
                const c = r.split(';'); 
                // c[0] = Código, c[1] = Descrição, c[3] = Centro, c[6] = Coluna G (Quantidade Disponível)
                return c.length >= 7 ? { cod: c[0].trim(), desc: c[1]?.trim(), centro: c[3].trim(), qtd: c[6].trim() } : null; 
            }).filter(x => x);

            // 4. Mapeamento do Kit de Materiais
          db.kitBase = textK.split('\n').slice(1).map(l => {
                const c = l.split(';'); if(c.length < 12) return null; // Valida até a Coluna L
                let descLimpa = c[9]?.trim().toUpperCase() || ""; descLimpa = descLimpa.replace(/MO/g, 'MAO').replace(/[^A-Z0-9\s,.\-\/()]/gi, '');
                return { 
                    est: c[2]?.trim(), red: c[3]?.trim(), pos: c[4]?.trim(), niv: c[5]?.trim(), alt: c[6]?.trim(), dan: c[7]?.trim(), cab: c[8]?.trim(), 
                    matDescOriginal: descLimpa, 
                    matCod: c[10]?.trim() ? c[10].replace(/\r|\n/g, '').trim() : "", 
                    matQtd: c[11]?.trim() ? c[11].replace(/\r|\n/g, '').trim() : "1", // AJUSTADO PARA COLUNA L (índice 11)
                    codigoKit: c[c.length - 1]?.trim() ? c[c.length - 1].replace(/\r|\n/g, '').trim() : "" 
                };
            }).filter(x => x && x.est && x.matCod);

            localStorage.setItem('fast_request_db', JSON.stringify(db));
            renderUsersTable();
            if(!silent) alert("Bases atualizadas com sucesso!");
        } catch (err) { console.error(err); }
    }

    function renderUsersTable() {
        const tbody = document.querySelector('#table-users tbody');
        if(tbody) tbody.innerHTML = db.users.map(u => `<tr><td>${u.nome}</td><td>${u.mat}</td></tr>`).join('');
    }

    const rascunho = localStorage.getItem('fast_request_draft');
    if (rascunho) {
        const d = JSON.parse(rascunho);
        if (d.centro_selecionado) {
            document.getElementById('centro_selecionado').value = d.centro_selecionado;
            document.getElementById('centro_busca').value = d.centro_busca || d.centro_selecionado;
        }
        if (d.itens) { listaSolicitacao = d.itens; renderList(); }
    }

    function deleteCard(i) { if(confirm("Excluir pedido do histórico?")) { historico.splice(i,1); localStorage.setItem('fast_request_history', JSON.stringify(historico)); renderHistory(); } }
    function confirmReset() { if(confirm("Limpar tudo?")) { localStorage.removeItem('fast_request_draft'); location.reload(); } }
</script>
