<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão de pedidos - V15.5.2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { 
            --blue-dark: #001a33; --blue-main: #003366; --accent: #21a366; 
            --danger: #d9534f; --bg: #e9ecef; --card: #ffffff; 
            --text: #333; --zebra: #f1f5f9;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 10px; display: flex; justify-content: center; color: var(--text); overflow-x: hidden; }
        .app { background: var(--card); width: 100%; max-width: 500px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); overflow: hidden; display: flex; flex-direction: column; height: 96vh; position: relative; border: 1px solid #ddd; }
        header { background: var(--blue-dark); color: white; padding: 20px; text-align: center; flex-shrink: 0; border-bottom: 4px solid var(--accent); position: relative; }
        .btn-top { background: var(--danger); color: white; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; position: absolute; right: 10px; top: 20px; }
        .tabs { display: flex; background: #f8f9fa; border-bottom: 1px solid #dee2e6; flex-shrink: 0; }
        .tab { flex: 1; padding: 15px 5px; text-align: center; cursor: pointer; font-weight: 700; font-size: 12px; color: #6c757d; text-transform: uppercase; }
        .tab.active { color: var(--blue-main); border-bottom: 3px solid var(--blue-main); background: #fff; }
        .content { padding: 12px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .page { display: none; flex-direction: column; gap: 12px; width: 100%; }
        .page.active { display: flex; }
        .form-section { background: #fcfcfc; border: 1px solid #eee; border-radius: 12px; padding: 12px; width: 100%; }
        .section-title { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; border-bottom: 1px solid #eee; padding-bottom: 5px; display: block; }
        label { font-weight: 700; font-size: 13px; color: var(--blue-main); display: block; margin-bottom: 4px; }
        input, select { padding: 12px; border: 1px solid #ced4da; border-radius: 10px; width: 100%; font-size: 16px; background: white; color: var(--text); }
        .material-box { border: 2px dashed #cbd5e0; padding: 12px; border-radius: 12px; background: #f1f5f9; position: relative; width: 100%; }
        .btn-add { background: var(--blue-main); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 15px; }
        .list-item { display: grid; grid-template-columns: auto 1fr auto 35px; gap: 10px; align-items: center; margin-bottom: 2px; padding: 10px; border-radius: 4px; font-size: 12px; border-bottom: 1px solid #eee; }
        .list-item:nth-child(even) { background-color: var(--zebra); }
        .history-card { background: #fff; padding: 15px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: relative; }
        .btn-del-card { position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 16px; cursor: pointer; color: var(--danger); }
        .hist-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; border-top: 1px solid #eee; }
        .hist-table td { padding: 8px 4px; border-bottom: 1px solid #f9f9f9; vertical-align: top; }
        .search-results { position: absolute; background: white; width: 100%; left: 0; z-index: 999; border: 1px solid #ccc; display: none; max-height: 200px; overflow-y: auto; border-radius: 10px; }
        footer { padding: 10px 15px; background: #fff; border-top: 1px solid #eee; text-align: center; flex-shrink: 0; }
        .btn-confirm { background: #ccc; color: #fff; border: none; padding: 16px; width: 100%; font-weight: 800; border-radius: 12px; cursor: not-allowed; font-size: 16px; }
        .btn-confirm.active { background: var(--accent); cursor: pointer; }
    </style>
</head>
<body>

<div class="app">
    <header>
        <strong>FAST REQUEST PRO</strong><br><small>Gestão de pedidos | V15.5.2</small>
        <button class="btn-top" onclick="confirmReset()">LIMPAR</button>
    </header>

    <div class="tabs">
        <div id="tab-request" class="tab active" onclick="switchTab('request')">📋 NOVO</div>
        <div id="tab-history" class="tab" onclick="switchTab('history')">📂 HISTÓRICO</div>
        <div id="tab-config" class="tab" onclick="switchTab('config')">⚙️ BASE</div>
    </div>

    <div class="content">
        <div id="page-request" class="page active" oninput="saveDraft()">
            <div class="form-section">
                <span class="section-title">📍 Localização de Estoque</span>
                <label>Centro:</label>
                <select id="sel_centro" onchange="selecionarCentro(this.value)">
                    <option value="">Carregando centros...</option>
                </select>
            </div>

            <div class="form-section">
                <span class="section-title">👤 Identificação</span>
                <div style="margin-bottom:12px">
                    <label>Solicitante:</label>
                    <div style="display:flex; gap:5px">
                        <input type="text" id="sol_nome" placeholder="Buscar..." onkeyup="searchData('sol')" style="flex:3">
                        <input type="text" id="sol_mat" readonly placeholder="Mat." style="flex:1.2; background:#f1f3f5; text-align:center;">
                    </div>
                    <div id="sol_results" class="search-results"></div>
                </div>
                <div>
                    <label>Atendente:</label>
                    <div style="display:flex; gap:5px">
                        <input type="text" id="ate_nome" placeholder="Buscar..." onkeyup="searchData('ate')" style="flex:3">
                        <input type="text" id="ate_mat" readonly placeholder="Mat." style="flex:1.2; background:#f1f3f5; text-align:center;">
                    </div>
                    <div id="ate_results" class="search-results"></div>
                </div>
            </div>

            <div class="form-section">
                <span class="section-title">🚧 Dados do Pedido</span>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:12px">
                    <div><label>Projeto/OSM:</label><input type="text" id="projeto" oninput="this.value = this.value.toUpperCase()"></div>
                    <div>
                        <label>Tipo:</label>
                        <select id="tipo_osm" onchange="toggleCalendario(); saveDraft()">
                            <option value="OSM">OSM</option>
                            <option value="Programada">Programada</option>
                        </select>
                    </div>
                </div>
                <div id="campo_calendario" style="display:none; margin-bottom:12px">
                    <label>Data Programada:</label>
                    <input type="date" id="data_programada" oninput="saveDraft()">
                </div>
            </div>

            <div class="material-box">
                <span class="section-title">📦 Seleção de Itens</span>
                <input type="text" id="mat_busca" placeholder="Selecione o centro primeiro..." onkeyup="searchData('mat')" disabled>
                <div id="mat_results" class="search-results"></div>
                <div id="mat_desc" style="font-size:13px; color:#003366; margin:8px 0; font-weight:bold;">Nenhum item selecionado</div>
                <div style="display:flex; gap:8px; align-items:flex-end">
                    <div style="flex:1"><label>QTD:</label><input type="text" id="mat_qtd" value="1" oninput="formatQtd(this)"></div>
                    <button id="btn_add_mat" class="btn-add" style="flex:1.5" onclick="addItem()" disabled>ADICIONAR</button>
                </div>
            </div>
            <div id="lista_ui"></div>
        </div>

        <div id="page-history" class="page">
            <div id="history_list"></div>
        </div>

        <div id="page-config" class="page">
            <div class="form-section">
                <button onclick="updateBaseFromGithub()" style="width:100%; padding:12px; background:var(--blue-dark); color:white; border-radius:8px; border:none; font-weight:bold;">ATUALIZAR BASES</button>
                <div id="status_base" style="font-size:11px; color:#666; text-align:center; margin-top:10px;"></div>
            </div>
        </div>
    </div>

    <footer>
        <button id="btn_confirm" class="btn-confirm" onclick="confirmarPedido()">CONFIRMAR SOLICITAÇÃO</button>
    </footer>
</div>

<script>
    let db = { users: [], mb52_raw: [], centros: [] };
    let estoqueFiltrado = [];
    let listaSolicitacao = [];
    let historico = [];
    let centroAtual = "";

    const URL_MB52 = "https://raw.githubusercontent.com/leiclermarvim-hash/teste-app-2.0/main/MB52.XLSX";
    const GITHUB_USERS = "https://raw.githubusercontent.com/leiclermarvim-hash/URL_USUARIOS_GITHUB/refs/heads/main/URL_USUARIOS_GITHUB.csv";

    window.onload = async () => {
        const h = localStorage.getItem('fast_request_history');
        if(h) historico = JSON.parse(h);
        const cachedDb = localStorage.getItem('fast_request_db');
        if(cachedDb) db = JSON.parse(cachedDb);
        await updateBaseFromGithub(true);
        loadDraft();
        renderHistory();
    };

    function toggleCalendario() {
        const tipo = document.getElementById('tipo_osm').value;
        document.getElementById('campo_calendario').style.display = (tipo === "Programada") ? "block" : "none";
    }

    async function baixarMB52() {
        try {
            const res = await fetch(URL_MB52);
            const buffer = await res.arrayBuffer();
            const workbook = XLSX.read(buffer, { type: 'array' });
            const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            db.mb52_raw = json;
            db.centros = [...new Set(json.map(item => item["Centro"] || item["__EMPTY_2"]))].filter(c => c && c !== "Centro");
            document.getElementById('sel_centro').innerHTML = '<option value="">Selecione...</option>' + db.centros.map(c => `<option value="${c}">${c}</option>`).join('');
        } catch (e) { console.error(e); }
    }

    function selecionarCentro(centro) {
        centroAtual = centro;
        const temp = {};
        db.mb52_raw.forEach(row => {
            if ((row["Centro"] || row["__EMPTY_2"]) == centro) {
                const cod = String(row["Material"] || row["__EMPTY"]).trim();
                const qtd = parseFloat(row["Utilização livre"] || row["__EMPTY_5"] || 0);
                const desc = row["Texto de material"] || row["__EMPTY_1"] || "";
                if (!temp[cod]) temp[cod] = { cod, desc, saldo: 0 };
                temp[cod].saldo += qtd;
            }
        });
        estoqueFiltrado = Object.values(temp);
        document.getElementById('mat_busca').disabled = false;
        document.getElementById('mat_busca').placeholder = "Buscar código/descrição...";
    }

    function searchData(mode) {
        const input = document.getElementById(mode === 'mat' ? 'mat_busca' : mode + '_nome');
        const resDiv = document.getElementById(mode + '_results');
        const t = input.value.toUpperCase();
        if (t.length < 2) { resDiv.style.display = 'none'; return; }
        let html = "";
        if (mode === 'mat') {
            html = estoqueFiltrado.filter(m => m.cod.includes(t) || m.desc.toUpperCase().includes(t)).slice(0, 10).map(x => `
                <div style="padding:10px; border-bottom:1px solid #eee; cursor:pointer;" onclick="selectMaterial('${x.cod}', '${x.desc.replace(/'/g,"")}', ${x.saldo})">
                    <b>${x.cod}</b> - Saldo: ${x.saldo}<br><small>${x.desc}</small>
                </div>`).join('');
        } else {
            html = db.users.filter(u => u.nome.includes(t)).slice(0, 8).map(x => `
                <div style="padding:10px; border-bottom:1px solid #eee; cursor:pointer;" onclick="selectUser('${mode}','${x.nome}','${x.mat}')">
                    <b>${x.nome}</b><br><small>${x.mat}</small>
                </div>`).join('');
        }
        resDiv.innerHTML = html; resDiv.style.display = html ? 'block' : 'none';
    }

    function selectMaterial(cod, desc, saldo) {
        document.getElementById('mat_busca').value = cod;
        document.getElementById('mat_desc').innerText = desc;
        document.getElementById('btn_add_mat').disabled = false;
        document.getElementById('mat_results').style.display = 'none';
    }

    function selectUser(mode, nome, mat) {
        document.getElementById(mode + '_nome').value = nome;
        document.getElementById(mode + '_mat').value = mat;
        document.getElementById(mode + '_results').style.display = 'none';
        saveDraft();
    }

    function formatQtd(el) { el.value = el.value.replace(/[^\d.,]/g, '').replace(/\./g, ','); }

    function addItem() {
        const cod = document.getElementById('mat_busca').value;
        const desc = document.getElementById('mat_desc').innerText;
        const qtd = document.getElementById('mat_qtd').value;
        listaSolicitacao.push({ cod, desc, qtd, centro: centroAtual });
        document.getElementById('mat_busca').value = "";
        document.getElementById('mat_desc').innerText = "Nenhum item selecionado";
        renderList(); saveDraft();
    }

    function renderList() {
        document.getElementById('lista_ui').innerHTML = listaSolicitacao.map((item, i) => `
            <div class="list-item">
                <b>${item.cod}</b>
                <div>${item.desc}</div>
                <div style="background:var(--blue-dark); color:white; padding:2px 6px; border-radius:4px;">${item.qtd}</div>
                <button onclick="removeItem(${i})" style="border:none; background:none;">🗑️</button>
            </div>`).reverse().join('');
        validarForm();
    }

    function removeItem(i) { listaSolicitacao.splice(i, 1); renderList(); saveDraft(); }

    function switchTab(t) {
        document.querySelectorAll('.tab, .page').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-'+t).classList.add('active');
        document.getElementById('page-'+t).classList.add('active');
        document.querySelector('footer').style.display = (t === 'request') ? 'block' : 'none';
        if(t === 'history') renderHistory();
    }

    async function updateBaseFromGithub(silent = false) {
        try {
            const resU = await fetch(GITHUB_USERS);
            const textU = await resU.text();
            db.users = textU.split('\n').slice(1).map(r => {
                const c = r.split(';');
                return c.length >= 2 ? { nome: c[0].trim().toUpperCase(), mat: c[1].trim() } : null;
            }).filter(x => x);
            await baixarMB52();
            localStorage.setItem('fast_request_db', JSON.stringify(db));
        } catch (err) { console.error(err); }
    }

    function validarForm() {
        const ok = document.getElementById('sol_mat').value && document.getElementById('projeto').value && listaSolicitacao.length > 0;
        const btn = document.getElementById('btn_confirm');
        btn.disabled = !ok; btn.classList.toggle('active', ok);
    }

    function saveDraft() {
        const d = {
            sol_nome: document.getElementById('sol_nome').value, sol_mat: document.getElementById('sol_mat').value,
            ate_nome: document.getElementById('ate_nome').value, ate_mat: document.getElementById('ate_mat').value,
            projeto: document.getElementById('projeto').value, tipo: document.getElementById('tipo_osm').value,
            data_prog: document.getElementById('data_programada').value, itens: listaSolicitacao
        };
        localStorage.setItem('fast_request_draft', JSON.stringify(d));
        validarForm();
    }

    function loadDraft() {
        const d = JSON.parse(localStorage.getItem('fast_request_draft') || '{}');
        if(!d.sol_nome) return;
        document.getElementById('sol_nome').value = d.sol_nome; document.getElementById('sol_mat').value = d.sol_mat;
        document.getElementById('ate_nome').value = d.ate_nome; document.getElementById('ate_mat').value = d.ate_mat;
        document.getElementById('projeto').value = d.projeto; document.getElementById('tipo_osm').value = d.tipo;
        document.getElementById('data_programada').value = d.data_prog;
        listaSolicitacao = d.itens || [];
        toggleCalendario(); renderList();
    }

    function confirmarPedido() {
        const novo = {
            data: new Date().toLocaleString('pt-BR'),
            projeto: document.getElementById('projeto').value,
            tipo: document.getElementById('tipo_osm').value,
            exec: document.getElementById('data_programada').value || "Imediata",
            solic: document.getElementById('sol_nome').value,
            itens: [...listaSolicitacao]
        };
        historico.unshift(novo);
        localStorage.setItem('fast_request_history', JSON.stringify(historico));
        localStorage.removeItem('fast_request_draft');
        alert("Pedido Confirmado!"); location.reload();
    }

    function renderHistory() {
        const container = document.getElementById('history_list');
        if(historico.length === 0) { container.innerHTML = "<p style='text-align:center; color:#999;'>Nenhum histórico.</p>"; return; }
        
        container.innerHTML = historico.map((h, i) => `
            <div class="history-card">
                <button class="btn-del-card" onclick="deleteHistory(${i})">✖</button>
                <div style="border-bottom:1px solid #eee; padding-bottom:8px; margin-bottom:8px;">
                    <strong style="color:var(--blue-main); font-size:14px;">PROJETO: ${h.projeto}</strong><br>
                    <small style="color:#666;">Data: ${h.data} | <b>${h.tipo}</b></small><br>
                    <small style="color:#666;">Execução: <b style="color:var(--accent);">${h.exec}</b></small>
                </div>
                <div style="font-size:11px; margin-bottom:5px;"><b>Solicitante:</b> ${h.solic}</div>
                <table class="hist-table">
                    ${h.itens.map(it => `
                        <tr>
                            <td style="width:60px;"><b>${it.cod}</b></td>
                            <td>${it.desc}<br><small style="color:#888;">Centro: ${it.centro || 'N/A'}</small></td>
                            <td style="text-align:right; width:40px;"><b>${it.qtd}</b></td>
                        </tr>
                    `).join('')}
                </table>
            </div>`).join('');
    }

    function deleteHistory(i) {
        if(confirm("Excluir?")) { historico.splice(i, 1); localStorage.setItem('fast_request_history', JSON.stringify(historico)); renderHistory(); }
    }

    function confirmReset() { if(confirm("Limpar?")) { localStorage.removeItem('fast_request_draft'); location.reload(); } }
</script>
</body>
</html>
